version: '3'

vars:
  AWS_PROFILE: ''

tasks:
  bundle:content-deployer:
    desc: Bundle content-deployer lambda zip to dist/lambdas
    sources:
      - src/runtime/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/content-deployer.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/runtime/content-deployer/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/content-deployer.zip

  bundle:bucket-auto-empty:
    desc: Bundle bucket-auto-empty lambda zip to dist/lambdas
    sources:
      - src/runtime/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/bucket-auto-empty.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/runtime/bucket-auto-empty/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/bucket-auto-empty.zip

  bundle:stack-deployer:
    desc: Bundle stack-deployer lambda zip to dist/lambdas
    sources:
      - src/runtime/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/stack-deployer.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/runtime/stack-deployer/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/stack-deployer.zip

  bundle:stack-helpers:
    desc: Bundle stack-helpers lambda zip to dist/lambdas
    sources:
      - src/runtime/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/stack-helpers.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/runtime/stack-helpers/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/stack-helpers.zip

  bundle:
    desc: Bundle all mailbox-cdk-shared lambdas to dist/lambdas/*.zip
    cmds:
      - task: bundle:content-deployer
      - task: bundle:bucket-auto-empty
      - task: bundle:stack-deployer
      - task: bundle:stack-helpers

  publish:dev:
    desc: Bundle and publish the shared runtime lambdas (content-deployer, bucket-auto-empty, stack-deployer, stack-helpers) to the dev channel
    preconditions:
      - sh: test -n "{{.AWS_PROFILE}}"
        msg: "AWS_PROFILE is not set. Pass the profile as a parameter: task publish:dev AWS_PROFILE=<profile>"
    env:
      AWS_PROFILE: '{{.AWS_PROFILE}}'
    cmds:
      - task: bundle:content-deployer
      - task: bundle:bucket-auto-empty
      - task: bundle:stack-deployer
      - task: bundle:stack-helpers
      - yarn artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/content-deployer.zip
      - yarn artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/bucket-auto-empty.zip
      - yarn artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/stack-deployer.zip
      - yarn artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/stack-helpers.zip
