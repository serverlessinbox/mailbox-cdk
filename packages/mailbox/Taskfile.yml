version: '3'

vars:
  BUCKET_BASE: mailbox-artifacts
  CDK_DEFAULT_ACCOUNT: '000000000000'

tasks:
  build:edge-stack:
    desc: Synthesize CloudFormation template for edge stack
    cmds:
      - yarn node --require ts-node/register tools/build-edge-stack.ts
    generates:
      - dist/edge-stack-template.json

  build:data-stack:
    desc: Synthesize CloudFormation template for data stack
    cmds:
      - yarn node --require ts-node/register tools/build-data-stack.ts
    generates:
      - dist/data-stack-template.json

  bundle:blob-authorizer:
    desc: Bundle blob-authorizer lambda zip to dist/lambdas
    sources:
      - src/ts-lambdas/blob-authorizer/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/blob-authorizer.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/blob-authorizer/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/blob-authorizer.zip

  bundle:resource-sweeper:
    desc: Bundle resource-sweeper lambda zip to dist/lambdas
    sources:
      - src/ts-lambdas/resource-sweeper/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/resource-sweeper.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/resource-sweeper/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/resource-sweeper.zip

  bundle:artifact-updater:
    desc: Bundle artifact-updater lambda zip to dist/lambdas
    sources:
      - src/ts-lambdas/artifact-updater/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/artifact-updater.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/artifact-updater/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/artifact-updater.zip

  bundle:data-override-resolver:
    desc: Bundle data-override-resolver lambda zip to dist/lambdas
    sources:
      - src/ts-lambdas/data-override-resolver/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - '{{.TASKFILE_DIR}}/dist/lambdas/data-override-resolver.zip'
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/data-override-resolver/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/data-override-resolver.zip

  bundle:
    desc: Bundle all TypeScript lambdas to dist/lambdas/*.zip
    cmds:
      - task: bundle:blob-authorizer
      - task: bundle:resource-sweeper
      - task: bundle:artifact-updater
      - task: bundle:data-override-resolver

  bundle:jsii:
    desc: Bundle jsii construct source (esbuild + tsc declarations)
    cmds:
      - yarn bundle:jsii
    sources:
      - src/**/*.ts
    generates:
      - lib/**/*.js
      - lib/**/*.d.ts

  publish:data:dev:
    desc: Publish data stack template to dev channel
    cmds:
      - task: build:data-stack
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object data-stack-template.json

  publish:edge:dev:
    desc: Publish edge stack template and lambdas to dev channel
    cmds:
      - task: build:edge-stack
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/blob-authorizer/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/blob-authorizer.zip
      - du -sh {{.TASKFILE_DIR}}/dist/lambdas/blob-authorizer.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/blob-authorizer.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object edge-stack-template.json

  publish:regional:dev:
    desc: Publish regional ts-lambdas to dev channel
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/resource-sweeper/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/resource-sweeper.zip
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/artifact-updater/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/artifact-updater.zip
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/data-override-resolver/index.ts --out {{.TASKFILE_DIR}}/dist/lambdas/data-override-resolver.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/resource-sweeper.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/artifact-updater.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/data-override-resolver.zip

  publish:dev:
    desc: Publish all artifacts (edge + regional + data) to dev channel
    env:
      AWS_PROFILE: serverlessinbox-dev
    cmds:
      - task: build:edge-stack
      - task: build:data-stack
      - task: bundle:blob-authorizer
      - task: bundle:resource-sweeper
      - task: bundle:artifact-updater
      - task: bundle:data-override-resolver
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}}
