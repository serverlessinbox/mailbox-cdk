version: '3'

vars:
  BUCKET_BASE: mailbox-artifacts
  CDK_DEFAULT_ACCOUNT: '000000000000'

tasks:
  build:edge-stack:
    desc: Synthesize CloudFormation template for edge stack
    cmds:
      - yarn node --require ts-node/register tools/build-edge-stack.ts
    generates:
      - dist/edge-stack-template.json

  build:data-stack:
    desc: Synthesize CloudFormation template for data stack
    cmds:
      - yarn node --require ts-node/register tools/build-data-stack.ts
    generates:
      - dist/data-stack-template.json

  bundle:blob-authorizer:
    desc: Bundle blob-authorizer lambda zip to /tmp
    sources:
      - src/ts-lambdas/blob-authorizer/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - /tmp/blob-authorizer.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/blob-authorizer/index.ts --out /tmp/blob-authorizer.zip --target node22 --external aws-sdk

  bundle:stack-deployer:
    desc: Bundle stack-deployer lambda zip to /tmp
    sources:
      - src/ts-lambdas/stack-deployer/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - /tmp/stack-deployer.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/stack-deployer/index.ts --out /tmp/stack-deployer.zip

  bundle:stack-helpers:
    desc: Bundle stack-helpers lambda zip to /tmp
    sources:
      - src/ts-lambdas/stack-helpers/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - /tmp/stack-helpers.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/stack-helpers/index.ts --out /tmp/stack-helpers.zip

  bundle:resource-sweeper:
    desc: Bundle resource-sweeper lambda zip to /tmp
    sources:
      - src/ts-lambdas/resource-sweeper/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - /tmp/resource-sweeper.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/resource-sweeper/index.ts --out /tmp/resource-sweeper.zip

  bundle:artifact-updater:
    desc: Bundle artifact-updater lambda zip to /tmp
    sources:
      - src/ts-lambdas/artifact-updater/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - /tmp/artifact-updater.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/artifact-updater/index.ts --out /tmp/artifact-updater.zip --external "@aws-sdk/*"

  bundle:ui-deployer:
    desc: Bundle ui-deployer lambda zip to /tmp (patches pre-2026-08-18 field deployments with no-op delete handler)
    sources:
      - ../mailbox-cdk-shared/src/ts-lambdas/content-deployer/**/*.ts
      - ../mailbox-cdk-shared/src/ts-lambdas/shared/**/*.ts
    generates:
      - /tmp/ui-deployer.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/../mailbox-cdk-shared/src/ts-lambdas/content-deployer/index.ts --out /tmp/ui-deployer.zip

  bundle:
    desc: Bundle all TypeScript lambdas to /tmp/*.zip
    cmds:
      - task: bundle:blob-authorizer
      - task: bundle:stack-deployer
      - task: bundle:stack-helpers
      - task: bundle:resource-sweeper
      - task: bundle:artifact-updater
      - task: bundle:ui-deployer

  bundle:jsii:
    desc: Bundle jsii construct source (esbuild + tsc declarations)
    cmds:
      - yarn bundle:jsii
    sources:
      - src/**/*.ts
    generates:
      - lib/**/*.js
      - lib/**/*.d.ts

  publish:data:dev:
    desc: Publish data stack template to dev channel
    cmds:
      - task: build:data-stack
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object data-stack-template.json

  publish:edge:dev:
    desc: Publish edge stack template and lambdas to dev channel
    cmds:
      - task: build:edge-stack
      - yarn mailbox-bundler lambda-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/blob-authorizer/index.ts --out /tmp/blob-authorizer.zip --target node22 --external aws-sdk
      - du -sh /tmp/blob-authorizer.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object lambdas/blob-authorizer.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object edge-stack-template.json

  publish:regional:dev:
    desc: Publish regional ts-lambdas to dev channel
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/stack-deployer/index.ts --out /tmp/stack-deployer.zip
      - yarn mailbox-bundler lambda-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/stack-helpers/index.ts --out /tmp/stack-helpers.zip
      - yarn mailbox-bundler lambda-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/resource-sweeper/index.ts --out /tmp/resource-sweeper.zip
      - yarn mailbox-bundler lambda-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/artifact-updater/index.ts --out /tmp/artifact-updater.zip --external "@aws-sdk/*"
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object lambdas/stack-deployer.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object lambdas/stack-helpers.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object lambdas/resource-sweeper.zip
      - yarn  artifact-registry publish channel --channel dev --cwd {{.USER_WORKING_DIR}} --object lambdas/artifact-updater.zip

  publish:dev:
    desc: Publish all artifacts (edge + regional + data) to dev channel
    env:
      AWS_PROFILE: serverlessinbox-dev
    cmds:
      - task: build:edge-stack
      - task: build:data-stack
      - task: bundle:blob-authorizer
      - task: bundle:stack-deployer
      - task: bundle:stack-helpers
      - task: bundle:resource-sweeper
      - task: bundle:artifact-updater
      - task: bundle:ui-deployer
      - yarn  artifact-registry publish channel --channel dev --cwd {{.TASKFILE_DIR}}
