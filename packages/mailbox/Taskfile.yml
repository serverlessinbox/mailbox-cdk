version: '3'

vars:
  BUCKET_BASE: mailbox-artifacts
  CDK_DEFAULT_ACCOUNT: '000000000000'

tasks:
  build:
    desc: Type-check TypeScript sources
    cmds:
      - tsc --noEmit

  build:watch:
    desc: Type-check in watch mode
    cmds:
      - tsc --noEmit --watch

  build:edge-stack:
    desc: Synthesize CloudFormation template for edge stack
    cmds:
      - yarn ts-node tools/build-edge-stack.ts
    generates:
      - dist/edge-stack-template.json

  # Edge artifact publishing (us-east-1 only)
  publish:edge:dev:
    desc: Publish edge stack template and lambdas to dev channel
    cmds:
      - task: build:edge-stack
      - yarn workspace @sipkg/mailbox-tools mailbox-tools publish file --mode channel --package mailbox-cdk-edge --channel dev --regions us-east-1 --file {{.USER_WORKING_DIR}}/dist/edge-stack-template.json --objectName template.json --awsProfile serverlessinbox-dev
      - yarn workspace @sipkg/mailbox-tools mailbox-tools bundle js-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/blob-authorizer/index.ts --out /tmp/blob-authorizer.zip
      - yarn workspace @sipkg/mailbox-tools mailbox-tools publish file --mode channel --package mailbox-cdk-edge --channel dev --regions us-east-1 --file /tmp/blob-authorizer.zip --objectName lambdas/blob-authorizer.zip --awsProfile serverlessinbox-dev

  publish:edge:release:
    desc: Publish edge stack template and lambdas to release version
    requires:
      vars:
        - VERSION
    cmds:
      - task: build:edge-stack
      - yarn workspace @sipkg/mailbox-tools mailbox-tools publish file --mode release --package mailbox-cdk-edge --version {{.VERSION}} --regions us-east-1 --file {{.USER_WORKING_DIR}}/dist/edge-stack-template.json --objectName template.json
      - yarn workspace @sipkg/mailbox-tools mailbox-tools bundle js-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/blob-authorizer/index.ts --out /tmp/blob-authorizer.zip
      - yarn workspace @sipkg/mailbox-tools mailbox-tools publish file --mode release --package mailbox-cdk-edge --version {{.VERSION}} --regions us-east-1 --file /tmp/blob-authorizer.zip --objectName lambdas/blob-authorizer.zip

  # Regional artifact publishing
  publish:regional:dev:
    desc: Publish regional ts-lambdas to dev channel
    cmds:
      - yarn workspace @sipkg/mailbox-tools mailbox-tools bundle js-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/edge-deployer/index.ts --out /tmp/edge-deployer.zip
      - yarn workspace @sipkg/mailbox-tools mailbox-tools publish file --mode channel --package mailbox-cdk --channel dev --file /tmp/edge-deployer.zip --objectName lambdas/edge-deployer.zip --awsProfile serverlessinbox-dev

  publish:regional:release:
    desc: Publish regional ts-lambdas to release version
    requires:
      vars:
        - VERSION
    cmds:
      - yarn workspace @sipkg/mailbox-tools mailbox-tools bundle js-zip --entry {{.USER_WORKING_DIR}}/src/ts-lambdas/edge-deployer/index.ts --out /tmp/edge-deployer.zip
      - yarn workspace @sipkg/mailbox-tools mailbox-tools publish file --mode release --package mailbox-cdk --version {{.VERSION}} --file /tmp/edge-deployer.zip --objectName lambdas/edge-deployer.zip

  # Combined publish targets
  publish:dev:
    desc: Publish all artifacts (edge + regional) to dev channel
    cmds:
      - task: publish:edge:dev
      - task: publish:regional:dev

  publish:release:
    desc: Publish all artifacts (edge + regional) to release version
    requires:
      vars:
        - VERSION
    cmds:
      - task: publish:edge:release
        vars:
          VERSION: '{{.VERSION}}'
      - task: publish:regional:release
        vars:
          VERSION: '{{.VERSION}}'

  # Utilities
  lint:
    desc: Run ESLint
    cmds:
      - eslint .

  test:
    desc: Run Jest tests
    cmds:
      - jest

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist lib
