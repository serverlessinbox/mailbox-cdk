version: '3'

tasks:
  generate:proto:idp-users:
    desc: Generate TypeScript types + client for IdP Users admin API (buf). Generated output is committed.
    cmds:
      - rm -rf {{.TASKFILE_DIR}}/src/ts-lambdas/cognito-idp-users-api/generated
      - mkdir -p {{.TASKFILE_DIR}}/src/ts-lambdas/cognito-idp-users-api/generated
      - |
        set -euo pipefail
        cd {{.TASKFILE_DIR}}/../../remote-git/mailbox-idl/admin-api
        (cd tools/protoc-gen-ts-client && go build -o protoc-gen-ts-client .)
        buf generate --template buf.gen.ts.yaml --path proto/idp_users.proto -o {{.TASKFILE_DIR}}/src/ts-lambdas/cognito-idp-users-api/generated

  verify:proto:idp-users:
    desc: Regenerate and fail if idp-users generated output differs from what is committed
    cmds:
      - task: generate:proto:idp-users
      - git diff --exit-code -- {{.TASKFILE_DIR}}/src/ts-lambdas/cognito-idp-users-api/generated

  # Regional artifact publishing
  bundle:idp-users-api:
    desc: Bundle cognito idp-users API lambda zip to /tmp
    sources:
      - src/ts-lambdas/cognito-idp-users-api/**/*.ts
    generates:
      - /tmp/cognito-idp-users-api.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/cognito-idp-users-api/index.ts --out /tmp/cognito-idp-users-api.zip --target node22

  bundle:custom-message:
    desc: Bundle cognito custom-message trigger lambda zip to /tmp
    sources:
      - src/ts-lambdas/custom-message/**/*.ts
    generates:
      - /tmp/cognito-custom-message.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/custom-message/index.ts --out /tmp/cognito-custom-message.zip --target node22

  bundle:bootstrap-user:
    desc: Bundle cognito bootstrap-user custom resource lambda zip to /tmp
    sources:
      - src/ts-lambdas/bootstrap-user/**/*.ts
    generates:
      - /tmp/cognito-bootstrap-user.zip
    cmds:
      - yarn mailbox-bundler lambda-zip --entry {{.TASKFILE_DIR}}/src/ts-lambdas/bootstrap-user/index.ts --out /tmp/cognito-bootstrap-user.zip --target node22

  bundle:
    desc: Bundle all cognito lambdas to /tmp/*.zip
    cmds:
      - task: bundle:idp-users-api
      - task: bundle:custom-message
      - task: bundle:bootstrap-user

  publish:dev:
    desc: Publish cognito regional ts-lambdas to dev channel
    env:
      AWS_PROFILE: serverlessinbox-dev
    cmds:
      - task: bundle:idp-users-api
      - task: bundle:custom-message
      - task: bundle:bootstrap-user
      - yarn  artifact-tools publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/cognito-idp-users-api.zip
      - yarn  artifact-tools publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/cognito-custom-message.zip
      - yarn  artifact-tools publish channel --channel dev --cwd {{.TASKFILE_DIR}} --object lambdas/cognito-bootstrap-user.zip
