name: Release Apps

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

jobs:
  release-apps:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: yarn install --immutable

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416716292717:role/github-actions-deploy-role
          aws-region: eu-west-1

      - name: Resolve component artifact versions
        run: yarn resolve-artifacts

      - name: Embed component versions in package.json
        run: yarn embed-component-versions

      - name: Synthesize CDK template
        run: yarn workspace @serverlessinbox/mailbox-standard-app synth:track

      - name: Extract version from package.json
        run: echo "VERSION=$(node -p "require('./apps/mailbox-standard-app/package.json').version")" >> $GITHUB_ENV

      - name: Publish app template
        run: yarn artifact-registry publish release --version $VERSION --cwd apps/mailbox-standard-app
