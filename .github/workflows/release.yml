name: Release

on:
  push:
    branches:
      - main
      - 'feat/*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: arduino/setup-task@v2
      - run: yarn install
      - run: yarn lint
      - run: yarn test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416716292717:role/github-actions-deploy-role
          aws-region: eu-west-1
      - name: Refresh registry record
        run: |
          yarn fetch-registry-record
          if git diff --quiet -- packages/mailbox/registry-record.json packages/mailbox-cognito/registry-record.json; then
            echo "Registry record unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/mailbox/registry-record.json packages/mailbox-cognito/registry-record.json
            git commit -m "chore: refresh registry record"
            git push origin "HEAD:${GITHUB_REF}"
          fi
      - run: yarn gitversion bump
      - name: Resolve component artifact versions
        run: yarn resolve-artifacts --output "$RUNNER_TEMP/mailbox-external-pins.json"
      - name: Bake artifact versions
        run: yarn bake-artifact-versions --mailbox-pins "$RUNNER_TEMP/mailbox-external-pins.json"
      - run: yarn gitversion pack
      # gitversion publish requires an npm registry to accept the publish. Packages are
      # published to S3, not to the npm registry, so this local stub accepts the publish
      # (any non-GET request gets a 200) and lets gitversion complete.
      - name: Start npm stub registry
        run: |
          node -e "
            require('http').createServer((req, res) => {
              req.resume();
              res.writeHead(req.method === 'GET' ? 404 : 200, {'Content-Type': 'application/json'});
              res.end(JSON.stringify({ok: true}));
            }).listen(12345);
          " &
      - run: yarn gitversion publish
        env:
          YARN_NPM_REGISTRY_SERVER: "http://127.0.0.1:12345"
          YARN_NPM_AUTH_TOKEN: "stub"
