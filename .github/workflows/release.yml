name: Release

on:
  push:
    branches:
      - main
      - 'feat/*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: arduino/setup-task@v2
      - run: yarn install
      - run: yarn gitversion bump
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416716292717:role/github-actions-deploy-role
          aws-region: eu-west-1
      - name: Check component artifacts exist in S3
        run: yarn ts-node scripts/check-artifacts.ts
      - name: Resolve component artifact versions
        run: yarn ts-node scripts/resolve-artifacts.ts
      - name: Commit resolved artifact-versions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact-versions.json
          git diff --cached --quiet || git commit -m "chore: resolve artifact versions [skip ci]"
      - name: Embed component versions in package.json
        run: |
          GO=$(yarn node -e "process.stdout.write(require('./artifact-versions.json')['mailbox-go'])")
          ADMINUI=$(yarn node -e "process.stdout.write(require('./artifact-versions.json')['mailbox-admin-ui'])")
          WEBMAIL=$(yarn node -e "process.stdout.write(require('./artifact-versions.json')['mailbox-webmail-ui'])")
          for pkg in packages/mailbox packages/mailbox-cognito; do
            jq --arg go "$GO" --arg adminui "$ADMINUI" --arg webmail "$WEBMAIL" \
              '.serverlessinbox = { components: { "mailbox-go": { version: $go }, "mailbox-admin-ui": { version: $adminui }, "mailbox-webmail-ui": { version: $webmail } } }' \
              "$pkg/package.json" > /tmp/pkg.json && mv /tmp/pkg.json "$pkg/package.json"
          done
      - run: yarn gitversion pack
      - name: Start npm stub registry
        run: |
          node -e "
            require('http').createServer((req, res) => {
              req.resume();
              res.writeHead(req.method === 'GET' ? 404 : 200, {'Content-Type': 'application/json'});
              res.end(JSON.stringify({ok: true}));
            }).listen(12345);
          " &
      - run: yarn gitversion publish
        env:
          YARN_NPM_REGISTRY_SERVER: "http://127.0.0.1:12345"
          YARN_NPM_AUTH_TOKEN: "stub"
      - name: Publish release manifest
        run: yarn ts-node scripts/publish-manifest.ts
