name: Release

on:
  push:
    branches:
      - main
      - 'feat/*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: yarn install
      - run: yarn gitversion bump
      - run: yarn build
      - run: yarn gitversion pack
      - uses: actions/upload-artifact@v4
        with:
          name: gitversion-packed
          path: .gitversion/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: yarn install
      - run: yarn tsc --noEmit

  publish:
    needs: [release, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: gitversion-packed
          path: .gitversion/
      - run: yarn gitversion publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
