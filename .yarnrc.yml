yarnPath: .yarn/releases/yarn-4.12.0.cjs

# Yarn Plug'n'Play is strict about dependency boundaries.
# `unzipper` conditionally requires `@aws-sdk/client-s3` and `readable-stream`,
# but they aren't declared in its published dependencies. Patch them in here so
# esbuild bundling works under PnP.
packageExtensions:
  "unzipper@*":
    dependencies:
      "@aws-sdk/client-s3": "^3.946.0"
      "readable-stream": "^4.0.0"
